# Render Blueprint — https://render.com/docs/blueprint-spec
# Gizli değerler (FIREBASE_CREDENTIALS_JSON, ADMIN_UIDS) panelden girilir (sync: false).
services:
  - type: web
    name: premium-berber-api
    runtime: docker
    rootDir: backend
    plan: starter
    region: frankfurt
    healthCheckPath: /saglik
    envVars:
      - key: ORTAM
        value: production
      - key: AUTH_MODE
        value: firebase
      - key: DATABASE_URL
        fromDatabase:
          name: premium-berber-db
          property: connectionString
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      - key: ADMIN_UIDS
        sync: false
      - key: CORS_ORIGINS
        value: https://premiumberber.app
      - key: ZAMAN_DILIMI
        value: Europe/Istanbul

databases:
  - name: premium-berber-db
    plan: basic-256mb
    region: frankfurt
    databaseName: berber
    user: berber
