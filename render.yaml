# Render Blueprint — https://render.com/docs/blueprint-spec
# Kurulum: Render → New → Blueprint → bu repo → dal: main.
# Gizli değerler (sync: false) panelden girilir. Adım adım: docs/deployment.md
#
# Mimari: web (gunicorn, N worker) + ayrı zamanlanmış görev süreci (worker) + yönetilen PostgreSQL.
# Görevler yalnızca worker'da çalışır; yine de DB kilidi (gorev_kilitleri) çift çalışmayı engeller.
# Ücretsiz plan uykuya geçtiği ve worker desteklemediği için önerilmez (bkz. docs/decisions.md "Render planı").
envVarGroups:
  - name: premium-berber-ortak
    envVars:
      - key: ORTAM
        value: production
      - key: AUTH_MODE
        value: firebase
      - key: ZAMAN_DILIMI
        value: Europe/Istanbul
      - key: LOG_FORMAT
        value: json
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      - key: ADMIN_UIDS
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: DESTEK_EPOSTA
        sync: false
      # İsteğe bağlı: kişisel veri şifreleme anahtarı (boş bırakılabilir). Girerseniz YEDEKLEYİN ve Shell'den
      # `python araclar.py veri-sifrele` çalıştırın. Ayrıntı: docs/deployment.md "Kişisel veri şifreleme"
      - key: VERI_ANAHTARI
        sync: false
      # Berber fotoğrafları: Render diski kalıcı olmadığından S3 uyumlu nesne depolama (örn. Cloudflare R2).
      # Yerel diske yazılsaydı her deploy'da silinirdi. Ayrıntı: docs/deployment.md "Dosya depolama"
      - key: DEPOLAMA
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ERISIM_ANAHTARI
        sync: false
      - key: S3_GIZLI_ANAHTAR
        sync: false
      - key: S3_GENEL_URL
        sync: false

services:
  - type: web
    name: premium-berber-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    region: frankfurt
    healthCheckPath: /health
    preDeployCommand: alembic upgrade head
    envVars:
      - fromGroup: premium-berber-ortak
      - key: DATABASE_URL
        fromDatabase:
          name: premium-berber-db
          property: connectionString
      - key: RUN_MIGRATIONS
        value: "0"
      - key: SCHEDULER_ENABLED
        value: "false"
      - key: WEB_CONCURRENCY
        value: "2"
      # Render proxy'si gelen X-Forwarded-For'u temizlemez, istemci adresini SONA ekler → sağdan 1.
      # Deploy sonrası doğrulayın: erişim logundaki "ip" alanı kendi IP'niz olmalı (docs/deployment.md).
      - key: GUVENILIR_PROXY_SAYISI
        value: "1"
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: CORS_ORIGINS
        value: https://premiumberber.app

  - type: worker
    name: premium-berber-gorevler
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: python worker.py
    plan: starter
    region: frankfurt
    envVars:
      - fromGroup: premium-berber-ortak
      - key: DATABASE_URL
        fromDatabase:
          name: premium-berber-db
          property: connectionString
      - key: RUN_MIGRATIONS
        value: "0"

databases:
  - name: premium-berber-db
    plan: basic-256mb
    region: frankfurt
    databaseName: berber
    user: berber
