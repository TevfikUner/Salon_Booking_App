name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Europe/Istanbul

jobs:
  backend:
    name: Backend (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: SQLite
            db: ""
            veri_anahtari: ""
          - name: PostgreSQL 16
            db: postgresql://berber:berber@localhost:5432/berber_test
            veri_anahtari: ""
          - name: SQLite + encryption
            db: ""
            veri_anahtari: ci-test-anahtari
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: berber
          POSTGRES_PASSWORD: berber
          POSTGRES_DB: berber_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U berber"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Migrations (empty DB → head → check)
        if: matrix.name == 'SQLite'
        env:
          DATABASE_URL: sqlite:///./ci_migration.db
        run: |
          alembic upgrade head
          alembic check
      - name: Tests
        env:
          TEST_DATABASE_URL: ${{ matrix.db }}
          VERI_ANAHTARI: ${{ matrix.veri_anahtari }}
        run: pytest

  app:
    name: Flutter app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: App
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Localizations up to date
        run: |
          flutter gen-l10n
          git diff --exit-code -- lib/l10n
      - name: Legal texts in sync with backend
        run: python3 ../scripts/yasal_senkron.py --kontrol
      - name: Analyze
        run: flutter analyze
      - name: Tests
        run: flutter test
